<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buttons & Actions</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 32px;
      line-height: 1.6;
      color: #334155;
      background: #f8fafc;
      margin: 0;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
      border: 1px solid #e2e8f0;
    }
    h1 { color: #0f172a; margin-top: 0; }
    button {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      background: #6366f1;
      color: white;
      font-weight: 500;
      cursor: pointer;
      margin-right: 8px;
    }
    button:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Buttons & Actions</h1>
    <p>This page documents our buttons and other call-to-actions.</p>
    <button>Primary Action</button>
    <button style="background: #e2e8f0; color: #0f172a;">Secondary</button>
  </div>
</body>
</html>
