<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asu Docs - Premium Documentation Viewer</title>
  <!-- Outfit Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0b0f19;
    }
    #app {
      height: 100%;
      width: 100%;
    }
  </style>
</head>
<body>

  <div id="app"></div>

  <script type="module">
    import AsuDocs from '../dist/index.es.js';
    
    // Initialize the Vanilla JS documentation app
    new AsuDocs('#app', {
      path: './document.manifest.json',
      title: 'Asu Docs JS',
      footer: '© 2026 Bruce Asu. Built with Vanilla JS & CSS.'
    });
  </script>

</body>
</html>
