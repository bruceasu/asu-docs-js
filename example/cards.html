<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cards & Panels</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 32px;
      line-height: 1.6;
      color: #334155;
      background: #f8fafc;
      margin: 0;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
      border: 1px solid #e2e8f0;
      margin-bottom: 16px;
    }
    h1 { color: #0f172a; margin-top: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Cards & Panels</h1>
    <p>Cards are used to group related information in a containers layout.</p>
  </div>
  <div class="card" style="border-left: 4px solid #6366f1;">
    <h3>Highlighted Card</h3>
    <p>Use left borders to draw attention to special notices.</p>
  </div>
</body>
</html>
